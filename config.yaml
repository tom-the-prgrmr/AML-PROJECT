# Single source of configuration. Any key can be overridden by an env var:
#   AML__<SECTION>__<KEY>=value      e.g. AML__THRESHOLDS__LARGE_CASH_VND=300000000
# Shortcut: DB_BACKEND=oracle|duckdb overrides db.backend.

seed: 42

db:
  backend: duckdb            # oracle | duckdb
  duckdb_path: data/aml.duckdb
  oracle:
    host: localhost
    port: 1521
    service: FREEPDB1
    user: aml_owner           # overridden by ORACLE_APP_USER in .env
    password: ""              # set ORACLE_APP_PASSWORD in .env (prod: wallet / vault)
  fallback_to_duckdb: true    # if Oracle is unreachable, warn and use DuckDB

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: ""                # set NEO4J_PASSWORD in .env
  # Neo4j Community has no RBAC, so a separate read-only user is impossible.
  # Investigation/Text2Cypher sessions use READ access mode (server rejects writes)
  # plus an application-level write-clause guard. Enterprise would add a reader role.

ollama:
  host: http://localhost:11434
  llm_model: qwen2.5:3b-instruct     # fits a 4GB GPU; switch to a 7B model on bigger hardware
  embed_model: bge-m3

data:
  profile: small             # small | dense | large
  output_dir: data/parquet
  reference_date: 2026-06-30   # "today" for data generation (ages, KYC dates, txn window end)
  start_date: 2026-01-01       # first day of the transaction window (spans profile `months`)
  profiles:
    small: {customers: 5000,  transactions: 300000,  months: 6, counterparties: [3, 12]}
    dense: {customers: 5000,  transactions: 300000,  months: 6, counterparties: [50, 100]}
    large: {customers: 50000, transactions: 5000000, months: 6, counterparties: [3, 12], typology_scale: 10}
  duplicate_person_rate: 0.08
  dq_defect_rate: 0.02
  injection_memos: 30        # prompt-injection memos planted in background transactions
  typologies:                # scenarios per typology; multiplied by the profile's typology_scale
    structuring: 20
    rapid_movement: 20
    mule_ring: 5
    round_tripping: 15
    benign_payroll: 5
    benign_merchant: 5
  watchlist:                 # fixed for every profile (override: AML__DATA__WATCHLIST__ENTRIES=200)
    entries: 2000
    true_hits: 20            # customers planted on the list
    traps: 30                # look-alike entries matching no customer
    year_only_dob_rate: 0.30
    unknown_dob_rate: 0.05

thresholds:
  large_cash_vnd: 400000000          # large-value cash reporting threshold (configurable)
  structuring_band_pct: 0.10         # "just below" = within 10% under the threshold

audit:
  system_actor: system

dq:
  max_feed_lag_days: 1       # TXN_FEED_STALE: newest transaction may lag as_of by this many days
  sample_size: 20            # failing entity_ids kept in dq_results.sample_ids

retention:
  transactions_months: 60    # months kept in the hot table; must be >= 60 (legal floor, 5 years)
  archive_dir: data/archive  # Parquet archive root (git-ignored under data/)

screening:
  token_set_weight: 0.5      # fuzzy = token_set_weight * token_set_ratio + jaro_winkler_weight * JW
  jaro_winkler_weight: 0.5   # the two weights must sum to 1.0
  token_match_min: 0.90      # min Jaro-Winkler for two tokens to count as the same token
  token_length_band: 1       # max length difference between two compared tokens
  rare_token_max_df_rate: 0.02   # token is "rare" when doc_freq / n_names <= this
  legal_strong_terms: [TNHH, MTV, CP, JSC, LTD, CTY, LLC, INC, CORP]   # dropped everywhere
  legal_weak_terms: [CONG TY, CO PHAN, CO]   # dropped only when a strong term was dropped
