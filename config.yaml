# Single source of configuration. Any key can be overridden by an env var:
#   AML__<SECTION>__<KEY>=value      e.g. AML__THRESHOLDS__LARGE_CASH_VND=300000000
# Shortcut: DB_BACKEND=oracle|duckdb overrides db.backend.

seed: 42

db:
  backend: duckdb            # oracle | duckdb
  duckdb_path: data/aml.duckdb
  oracle:
    host: localhost
    port: 1521
    service: FREEPDB1
    user: aml_owner           # overridden by ORACLE_APP_USER in .env
    password: ""              # set ORACLE_APP_PASSWORD in .env (prod: wallet / vault)
  fallback_to_duckdb: true    # if Oracle is unreachable, warn and use DuckDB

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: ""                # set NEO4J_PASSWORD in .env
  database: neo4j
  read_timeout_seconds: 60    # server-side timeout of every read-path query; > 0
  # Procedures the read path may CALL (fnmatch patterns); everything else is rejected by the guard.
  read_procedures: [db.labels, db.relationshipTypes, db.propertyKeys, db.schema.visualization, db.schema.nodeTypeProperties, db.schema.relTypeProperties, dbms.components]
  # Neo4j Community has no RBAC, so a separate read-only user is impossible.
  # Investigation/Text2Cypher sessions use READ access mode (server rejects writes)
  # plus an application-level write-clause guard. Enterprise would add a reader role.

ollama:
  host: http://localhost:11434
  llm_model: qwen2.5:3b-instruct     # fits a 4GB GPU; switch to a 7B model on bigger hardware
  embed_model: bge-m3

data:
  profile: small             # small | dense | large
  output_dir: data/parquet
  reference_date: 2026-06-30   # "today" for data generation (ages, KYC dates, txn window end)
  start_date: 2026-01-01       # first day of the transaction window (spans profile `months`)
  profiles:
    small: {customers: 5000,  transactions: 300000,  months: 6, counterparties: [3, 12]}
    dense: {customers: 5000,  transactions: 300000,  months: 6, counterparties: [50, 100]}
    large: {customers: 50000, transactions: 5000000, months: 6, counterparties: [3, 12], typology_scale: 10}
  duplicate_person_rate: 0.08
  dq_defect_rate: 0.02
  injection_memos: 30        # prompt-injection memos planted in background transactions
  typologies:                # scenarios per typology; multiplied by the profile's typology_scale
    structuring: 20
    rapid_movement: 20
    mule_ring: 5
    round_tripping: 15
    benign_payroll: 5
    benign_merchant: 5
  watchlist:                 # fixed for every profile (override: AML__DATA__WATCHLIST__ENTRIES=200)
    entries: 2000
    true_hits: 20            # customers planted on the list
    traps: 30                # look-alike entries matching no customer
    year_only_dob_rate: 0.30
    unknown_dob_rate: 0.05

thresholds:
  large_cash_vnd: 400000000          # large-value cash reporting threshold (configurable)
  structuring_band_pct: 0.10         # "just below" = within 10% under the threshold

audit:
  system_actor: system

dq:
  max_feed_lag_days: 1       # TXN_FEED_STALE: newest transaction may lag as_of by this many days
  sample_size: 20            # failing entity_ids kept in dq_results.sample_ids

retention:
  transactions_months: 60    # months kept in the hot table; must be >= 60 (legal floor, 5 years)
  archive_dir: data/archive  # Parquet archive root (git-ignored under data/)

screening:
  token_set_weight: 0.5      # fuzzy = token_set_weight * token_set_ratio + jaro_winkler_weight * JW
  jaro_winkler_weight: 0.5   # the two weights must sum to 1.0
  token_match_min: 0.90      # min Jaro-Winkler for two tokens to count as the same token
  token_length_band: 1       # max length difference between two compared tokens
  rare_token_max_df_rate: 0.02   # token is "rare" when doc_freq / n_names <= this
  legal_strong_terms: [TNHH, MTV, CP, JSC, LTD, CTY, LLC, INC, CORP]   # dropped everywhere
  legal_weak_terms: [CONG TY, CO PHAN, CO]   # dropped only when a strong term was dropped
  alert_threshold: 90        # final_score >= this -> ALERT
  review_threshold: 75       # final_score >= this -> REVIEW (also the recording threshold)
  dob_tolerance_years: 1     # birth-year gap <= this counts as a match
  dob_clear_years: 5         # birth-year gap > this -> AUTO_CLEARED
  dob_gap_discount: 15       # points off when the gap is in (tolerance, clear]
  nationality_mismatch_discount: 15   # points off when both nationalities are known and differ
  gender_mismatch_discount: 15        # points off when both genders are known and differ
  sql_length_band: 3         # SQL screen: max length gap between two compared name keys

entity_resolution:
  match_threshold: 0.95      # match_probability >= this -> MATCH (clustered)
  review_threshold: 0.50     # >= this and < match_threshold -> REVIEW (stored, not clustered)
  name_jw_thresholds: [0.92, 0.80]   # Jaro-Winkler levels on name_key, descending
  deterministic_recall: 0.9  # assumed recall of the deterministic rules (prior estimate)
  u_max_pairs: 1000000       # max random pairs used to estimate u
  m_probabilities:           # fixed m per comparison level (null level excluded); each sums to 1.0
    name: [0.60, 0.25, 0.10, 0.05]     # same name_key | JW >= 0.92 | JW >= 0.80 | other
    dob: [0.97, 0.03]                  # same | different
    phone: [0.90, 0.10]                # same | different
    email: [0.45, 0.55]                # same | different
    address: [0.85, 0.10, 0.05]        # same normalised address | same new province | other
    id: [0.98, 0.02]                   # same kind and number | same kind, different number

monitoring:                  # Phase 5a; thresholds.large_cash_vnd / structuring_band_pct are reused
  known_counterparty_days: 14   # counterparties seen this long ago are "known"; also the warm-up period
  structuring: {window_days: 14, min_deposits: 3}
  rapid_movement: {window_hours: 24, min_inflow_vnd: 200000000, min_pass_through_pct: 0.90}
  high_velocity: {window_hours: 24, min_txns: 8, min_total_vnd: 100000000}
  fan_in_out: {window_days: 7, min_counterparties: 8, min_total_vnd: 100000000}
  dormant_reactivation: {dormant_days: 90, window_hours: 24, min_amount_vnd: 100000000}

trace:                       # Phase 5b fund-flow tracing (aml trace)
  default_hops: 3            # N when the caller gives none
  default_hours: 72          # T when the caller gives none
  max_hops: 6                # ceiling of N; must not exceed 6 (blocks of pgq.sql, width of the path column)
  max_hours: 720             # ceiling of T (bounds the number of paths)
  max_paths: 100000          # more rows than this -> TraceError, never a silent cut
  edge_min_amount_vnd: 10000000   # cte_edge: drop daily edges whose total_amount is below this
  edge_top_k: 5              # cte_edge: biggest daily edges followed at each step; 0 = unlimited

network:                     # Phase 5c network detections (aml network); NetworkX on three DataFrames
  shared_attributes: {min_customers: 5, max_customers_per_value: 50}   # NET_SHARED_ATTRIBUTE
  cycles:                    # NET_CYCLE
    min_length: 3
    max_length: 5            # must not exceed 6
    window_hours: 168        # last hop before first hop + window
    min_amount_vnd: 50000000   # smaller transfers are ignored
    min_amount_ratio: 0.70   # smallest / largest transfer of the cycle
    max_search_steps: 1000000   # more steps -> NetworkError, never a silent cut
  hubs:                      # NET_HUB
    lookback_days: 365
    min_in_degree: 10
    min_pagerank_ratio: 1.8  # pagerank * accounts with an edge
    min_inflow_vnd: 100000000
    pagerank_alpha: 0.85

graph_sync:                  # Phase 6a Oracle -> Neo4j projection (aml graph sync)
  oracle_user: aml_graph_sync_usr   # read-only demo user; password = ORACLE_DEMO_PASSWORD
  batch_size: 5000           # rows per UNWIND = one Neo4j transaction; 1..50000
  overlap_minutes: 60        # incremental re-reads from watermark - overlap; >= 0

graph_queries:                # Phase 6b investigation queries on Neo4j (aml graph query)
  max_rows: 10000            # more rows than this is an error, never a silent cut; >= 1

gds:                          # Phase 6b-ii Neo4j Graph Data Science features (aml graph gds)
  # Procedures only the GDS runner's own gds/*.cypher files may CALL; never the ordinary read path.
  procedures: [gds.graph.project, gds.graph.drop, "gds.*.stream"]
  graph_prefix: aml_gds      # in-memory graphs: <prefix>_accounts, _accounts_undirected, _shared
  concurrency: 1             # 1..4; 1 keeps runs reproducible
  pagerank_max_iterations: 200  # >= 1
  pagerank_tolerance: 1.0e-10   # > 0; write 1.0e-10, PyYAML reads 1e-10 as a string
  louvain_max_levels: 10        # >= 1
  louvain_max_iterations: 10    # >= 1
  louvain_tolerance: 0.0001     # >= 0

cases:                       # Phase 7a alert consolidation into cases (aml cases build)
  window_days: 90            # >= 1; a case window is anchored on its first alert
  txn_summary_days: 90       # >= 1; transaction summary ends on the day of the last alert
  top_counterparties: 5      # >= 0; largest counterparties kept in the network enrichment
  graph_features: auto       # auto | networkx | gds; auto prefers GDS when it is from the same as_of
  suppression:               # Phase 7b-supp: good-guy list and hibernation, applied per item in run_cases
    good_guy_days: 365       # >= 1; a cleared screening pair stays quiet this long (unless its data changes)
    hibernation_days: 90     # >= 1; a repeated false-positive pattern sleeps this long from its latest clearance
    hibernation_min_false_positives: 2   # >= 1; cleared alerts of a pattern before it sleeps
    material_change_ratio: 1.5           # >= 1.0; amount above ratio x the largest cleared alert wakes the pattern
  prioritization:            # Phase 7c: simulated dispositions, case features, ranking model (aml score)
    model: logreg            # logreg | lightgbm (lightgbm needs: uv sync --extra ml)
    simulate_dispositions: true   # does aml score simulate dispositions from ground truth first
    simulate_fraction: 0.7   # (0, 1]; share of the case groups that get a simulated disposition
    simulated_actor: simulated_analyst   # must differ from audit.system_actor
    cv_folds: 5              # >= 2; StratifiedGroupKFold splits
    top_features: 5          # >= 1; contributing features stored with each score
    top_fractions: [0.1, 0.2, 0.5]   # each in (0, 1]; head / tail shares of the queue for the metrics
    logreg: {c: 1.0, max_iter: 1000}
    lightgbm: {n_estimators: 100, num_leaves: 15, learning_rate: 0.1, min_child_samples: 5}
  summary:                   # Phase 7d case summary (aml cases summary); read-only, nothing stored
    generator: template      # registered NarrativeGenerator; "template" uses no LLM
    language: en             # the template generator is English only

bench:                       # Phase 6c trace benchmark (aml bench); measures the state a backend is in
  hops: [2, 4, 6]            # increasing, each 1..trace.max_hops
  hours: [72, 720]           # window T; increasing, each 1..trace.max_hours (72 = aml trace default, 720 = ceiling)
  runs: 10                   # timed runs per cell; >= 5
  warmup_runs: 1             # runs thrown away before the timed ones; >= 0
  accounts: []               # empty -> the account(s) with most time-ordered 2-hop paths in max(hours)
  top_accounts: 1            # how many accounts pick_accounts chooses; 1..10
  results_dir: results/phase6   # bench_<profile>_<backend>.json, bench_report.md, bench_chart.svg
