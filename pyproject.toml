[project]
name = "aml-toolkit"
version = "0.1.0"
description = "AML investigation toolkit demo: screening, entity resolution, monitoring, graph analysis, case prioritization, GraphRAG."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.1",
    "oracledb>=2.4",
    "neo4j>=6.3.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.9",
    "splink>=5.0,<6",
    "networkx>=3.4,<4",
    "scipy>=1.13",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.5",
    "neo4j-graphrag>=1.22,<2",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3"]

[project.scripts]
aml = "aml.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp lives in the project and is wiped at the start of every run, so the system temp
# drive does not fill up with TINY databases
addopts = "-ra --basetemp=.pytest_tmp"
markers = [
    "oracle: needs a running Oracle service (skipped otherwise)",
    "neo4j: needs a running Neo4j service (skipped otherwise)",
    "ollama: needs a running Ollama service (skipped otherwise)",
]
