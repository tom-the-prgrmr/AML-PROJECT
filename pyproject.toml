[project]
name = "aml-toolkit"
version = "0.1.0"
description = "AML investigation toolkit demo: screening, entity resolution, monitoring, graph analysis, case prioritization, GraphRAG."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.1",
    "oracledb>=2.4",
    "neo4j>=5.20",
]

[project.scripts]
aml = "aml.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "oracle: needs a running Oracle service (skipped otherwise)",
    "neo4j: needs a running Neo4j service (skipped otherwise)",
    "ollama: needs a running Ollama service (skipped otherwise)",
]
